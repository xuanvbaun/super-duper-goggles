<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人 AI 工作流</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#20302b;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}header{background:#153e35;color:white;padding:28px 5%}header p{color:#c3dbd1;margin-bottom:0}main{max-width:1260px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:340px 1fr;gap:22px}section{background:white;border:1px solid #dfe5df;border-radius:12px;padding:24px;margin-bottom:20px}h1{font-size:25px;margin:0}h2{font-size:18px;margin-top:0}label{display:block;margin:16px 0 8px;font-size:14px}textarea,input{width:100%;padding:12px;border:1px solid #ccd7d1;border-radius:7px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:7px;padding:10px 15px;background:#1c6955;color:white;cursor:pointer;margin:10px 6px 0 0;font:inherit}button:disabled{opacity:.45;cursor:default}.secondary{background:#edf3ef;color:#214b3e}.task{display:block;text-align:left;width:100%;background:#f0f5f1;color:#233b31;padding:14px}.task.active{outline:2px solid #31785e}.muted{color:#697a72;font-size:13px}.badge{display:inline-block;background:#edf3ed;padding:5px 10px;border-radius:6px;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f4;border-radius:8px;padding:16px;max-height:360px;overflow:auto;font-size:13px}.flow{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{padding:6px 9px;background:#f1f3ef;border-radius:5px;font-size:12px}.step.current{background:#236c56;color:white}#message{color:#9c382a;min-height:24px;padding:0 24px;max-width:1260px;margin:auto}.hidden{display:none}@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
<header><h1>个人 AI 工作流</h1><p>提出目标 → 执行 → 验证 → 验收　·　本地 / 第一阶段</p></header>
<div id="message" role="alert"></div><main><aside><section><h2>新建任务</h2>
<form id="create"><label for="goal">你希望完成什么？</label><textarea id="goal" required maxlength="4000" placeholder="例如：帮我计算这些数字的平均值"></textarea>
<label for="source">输入数据</label><textarea id="source" maxlength="100000" placeholder="10, 20, 30"></textarea>
<p class="muted">支持：数字统计、JSON 校验、文本统计。其他任务仅分类交接。</p>
<button type="submit">创建并执行</button></form>
<button class="secondary" id="example">填入示例</button></section>
<section><h2>任务记录</h2><div id="list">尚无任务</div></section></aside>
<article><section><h2>执行流程</h2><p id="empty" class="muted">创建一个任务，查看执行进度与验证结果。</p>
<div id="detail" class="hidden"><h3 id="title"></h3><span id="executor" class="badge"></span><div id="flow" class="flow"></div><p id="status"></p><button id="run">执行当前方案</button></div></section>
<section><h2>结果与自动检查</h2><p id="checks" class="muted">等待执行</p><pre id="result">暂无结果</pre></section>
<section id="reviewPanel" class="hidden"><h2>总控验收 · 人工入口</h2><p class="muted">第一阶段由你代行总控验收；自动检查通过不会直接完成任务。</p>
<label for="note">验收 / 重规划说明</label><input id="note" maxlength="4000" placeholder="记录判断依据">
<label for="revised">重规划时的新输入数据</label><textarea id="revised" maxlength="100000"></textarea>
<button id="approve">验收通过</button><button id="reject" class="secondary">拒绝并停止</button><button id="replan" class="secondary">调整输入并重规划一次</button></section>
<section><h2>详细日志</h2><pre id="logs">暂无日志</pre></section></article></main>
<script>
const $=id=>document.getElementById(id);let current=null,busy=false;
async function api(path,body){const r=await fetch('/api/tasks'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Workflow-Client':'local-ui'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function action(fn){if(busy)return;busy=true;$('message').textContent='';try{await fn()}catch(e){$('message').textContent=e.message}finally{busy=false}}
function render(t){current=t;$('detail').classList.remove('hidden');$('empty').classList.add('hidden');$('title').textContent=t.goal;$('executor').textContent='执行器：'+t.executor;$('status').textContent='当前：'+t.status+' · 已尝试 '+t.attempts+' 次'+(t.error?' · '+t.error:'');$('flow').replaceChildren();for(const s of ['NEW','PLANNED','RUNNING','VERIFYING','REVIEW','DONE']){const n=document.createElement('span');n.className='step'+(t.status===s?' current':'');n.textContent=s;$('flow').append(n)}$('run').classList.toggle('hidden',t.status!=='PLANNED');$('checks').textContent=t.tests.length?`${t.tests.filter(x=>x.passed).length} / ${t.tests.length} 项检查通过`:'暂无自动检查';$('result').textContent=t.result?JSON.stringify(t.result,null,2):'尚无执行结果';$('logs').textContent=t.events.map(e=>`${e.at}\n${e.status}  ${e.message}`).join('\n\n');$('reviewPanel').classList.toggle('hidden',t.status!=='REVIEW');$('approve').disabled=!(t.result&&!t.error&&t.tests.length&&t.tests.every(x=>x.passed));$('replan').disabled=t.replans>0||t.executor!=='python';$('revised').value=t.inputs[0]}
async function refresh(){const tasks=await api('');$('list').replaceChildren();if(!tasks.length)$('list').textContent='尚无任务';for(const t of tasks){const b=document.createElement('button');b.className='task'+(current?.task_id===t.task_id?' active':'');b.textContent=t.goal+' · '+t.status;b.onclick=()=>action(async()=>{render(await api('/'+t.task_id));await refresh()});$('list').append(b)}}
$('create').onsubmit=e=>{e.preventDefault();action(async()=>{const t=await api('',{goal:$('goal').value,source:$('source').value});render(t);render(await api('/'+t.task_id+'/run',{}));await refresh()})};
$('example').onclick=()=>{$('goal').value='计算这些数字的平均值和总和';$('source').value='10, 20, 30'};
$('run').onclick=()=>action(async()=>{render(await api('/'+current.task_id+'/run',{}));await refresh()});
for(const decision of ['approve','reject','replan'])$(decision).onclick=()=>action(async()=>{render(await api('/'+current.task_id+'/review',{decision,note:$('note').value,source:$('revised').value}));$('note').value='';await refresh()});
action(refresh);
</script></html>
