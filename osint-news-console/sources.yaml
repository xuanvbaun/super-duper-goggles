# RSS 源配置
# credibility: 1(极低) ~ 5(极高)
# interval_minutes 可按来源覆盖全局频率；军事源使用 5 分钟，其余默认 30 分钟。
# official=true 表示政府、军队或国际组织的官方发布渠道。

sources:
  # ===== 官方 / 综合 / 政治 =====
  - name: "人民网-国际"
    url: "http://www.people.com.cn/rss/world.xml"
    category: "国际"
    credibility: 5
    official: true
    interval_minutes: 30
    enabled: true

  - name: "人民网-时政"
    url: "http://www.people.com.cn/rss/politics.xml"
    category: "政治"
    credibility: 5
    official: true
    interval_minutes: 30
    enabled: true

  - name: "联合国新闻"
    url: "https://news.un.org/feed/subscribe/zh/news/all/rss.xml"
    category: "国际"
    credibility: 5
    official: true
    interval_minutes: 30
    enabled: true

  # ===== 军事（高频） =====
  - name: "人民网-军事"
    url: "http://www.people.com.cn/rss/military.xml"
    category: "军事"
    credibility: 5
    official: true
    interval_minutes: 5
    enabled: true

  - name: "中国军网"
    url: "http://www.81.cn/rss/node_39175.xml"
    category: "军事"
    credibility: 5
    official: true
    interval_minutes: 5
    enabled: false
    note: "2026-08 实测该旧RSS地址返回404；保留配置等待替换为官方可用接口"

  # ===== 财经 =====
  - name: "人民网-财经"
    url: "http://www.people.com.cn/rss/finance.xml"
    category: "财经"
    credibility: 5
    official: true
    interval_minutes: 30
    enabled: true

  - name: "联合早报"
    url: "https://www.zaobao.com/rss"
    category: "综合"
    credibility: 5
    interval_minutes: 30
    enabled: false
    note: "⚠️ 解析偶有问题，暂禁用观察"

  # ===== 科技 =====
  - name: "IT之家"
    url: "https://www.ithome.com/rss"
    category: "科技"
    credibility: 4
    interval_minutes: 30
    enabled: true
    note: "🆕 60条/次，泛科技快讯"

  - name: "少数派"
    url: "https://sspai.com/feed"
    category: "科技"
    credibility: 4
    interval_minutes: 30
    enabled: true
    note: "🆕 10条/次，效率工具/数码"

  - name: "爱范儿"
    url: "https://www.ifanr.com/feed"
    category: "科技"
    credibility: 3
    interval_minutes: 30
    enabled: true
    note: "🆕 20条/次，消费科技"

  - name: "量子位"
    url: "https://www.qbitai.com/feed"
    category: "科技"
    credibility: 4
    interval_minutes: 30
    enabled: true
    note: "🆕 10条/次，AI/前沿科技"

  - name: "阮一峰周刊"
    url: "https://www.ruanyifeng.com/blog/atom.xml"
    category: "科技"
    credibility: 4
    interval_minutes: 30
    enabled: true
    note: "🆕 周刊，3条/周，技术+人文"

  - name: "Solidot"
    url: "https://www.solidot.org/index.rss"
    category: "科技"
    credibility: 4
    interval_minutes: 30
    enabled: true

  - name: "InfoQ 中文"
    url: "https://www.infoq.cn/feed"
    category: "科技"
    credibility: 4
    interval_minutes: 30
    enabled: true

  - name: "Hacker News"
    url: "https://hnrss.org/frontpage"
    category: "科技"
    credibility: 3
    interval_minutes: 30
    enabled: true
    note: "英文源，社区投票"

  - name: "36氪"
    url: "https://36kr.com/feed"
    category: "科技"
    credibility: 3
    interval_minutes: 30
    enabled: true

  # ===== 安全 =====
  - name: "FreeBuf"
    url: "https://www.freebuf.com/feed"
    category: "安全"
    credibility: 4
    enabled: false
    note: "❌ 阿里云 WAF 拦截"

  # ===== 财经备用 =====
  - name: "华尔街见闻"
    url: "https://rsshub.app/wallstreetcn/global"
    category: "财经"
    credibility: 3
    enabled: false
    note: "⚠️ 需 RSSHub 实例"

  # ===== 国际 / 世界综合 =====
  - name: "BBC中文"
    url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml"
    category: "国际"
    credibility: 4
    interval_minutes: 30
    enabled: true
    note: "部分网络环境可能无法访问；失败会在来源状态页显示"

  - name: "德国之声中文"
    url: "https://rss.dw.com/rdf/rss-chi-all"
    category: "国际"
    credibility: 4
    interval_minutes: 30
    enabled: true

  # ===== 备用 =====
  - name: "OSChina"
    url: "https://www.oschina.net/news/rss"
    category: "科技"
    credibility: 3
    enabled: false
    note: "内容量大，后续按需开启"

  - name: "新华网"
    url: "https://rsshub.app/xinhuanet/index"
    category: "综合"
    credibility: 5
    enabled: false
    note: "⚠️ 需 RSSHub"
