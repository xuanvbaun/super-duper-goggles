# RSS 源配置
# credibility: 1(极低) ~ 5(极高)
# stale_after_hours: 最新条目超过该时长后，即使 HTTP 200 也标记为“已过时”。
# use_entry_source: 聚合源显示原始媒体名，而不是统一显示聚合器名称。

sources:
  # ===== 军事：5 分钟轮询 =====
  - name: "中国军网（Google 索引）"
    url: "https://news.google.com/rss/search?q=site%3A81.cn%20%E5%86%9B%E4%BA%8B&hl=zh-CN&gl=CN&ceid=CN%3Azh-Hans"
    category: "军事"
    credibility: 5
    official: true
    interval_minutes: 5
    stale_after_hours: 24
    enabled: true
    note: "限定中国军网域名；用于替代已失效的旧版官方 RSS 地址"

  - name: "中国国防部（Google 索引）"
